name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.13"

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install dev dependencies
        run: pip install -r requirements-dev.txt

      - name: ruff check
        run: ruff check .

      - name: ruff format --check
        run: ruff format --check .

  test:
    name: Tests (PostgreSQL)
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: upload_stack
          POSTGRES_USER: upload_stack
          POSTGRES_PASSWORD: upload_stack_ci_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U upload_stack -d upload_stack"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      SECRET_KEY: ci-only-secret-key-not-used-in-production
      DEBUG: "0"
      DJANGO_DB: postgres
      POSTGRES_DB: upload_stack
      POSTGRES_USER: upload_stack
      POSTGRES_PASSWORD: upload_stack_ci_password
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install dev dependencies
        run: pip install -r requirements-dev.txt

      - name: Django system checks
        run: python manage.py check

      - name: Fail if a model change has no migration
        run: python manage.py makemigrations --check --dry-run

      - name: pytest
        run: pytest

  docs:
    name: Docs build (mkdocs --strict)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install docs dependencies
        run: pip install -r requirements-docs.txt

      - name: Build the documentation
        run: mkdocs build --strict

  build:
    name: Build application image
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      # Required for the type=gha cache backend: the default "docker" driver
      # does not support it.
      - uses: docker/setup-buildx-action@v4

      - name: Build the runtime image
        uses: docker/build-push-action@v7
        with:
          context: .
          target: runtime
          push: false
          tags: django-upload-stack-web:ci
          # mode=max also exports the builder stage's layers, which is where the slow
          # pip install lives; mode=min would cache almost nothing useful here.
          cache-from: type=gha
          cache-to: type=gha,mode=max

  smoke:
    name: Smoke test (full stack)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    needs: [lint, test, build]
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Create .env from the example
        run: |
          cp .env.example .env
          sed -i "s|^SECRET_KEY=.*|SECRET_KEY=$(openssl rand -hex 32)|" .env
          sed -i "s|^POSTGRES_PASSWORD=.*|POSTGRES_PASSWORD=$(openssl rand -hex 16)|" .env

      - name: Validate the compose file
        run: docker compose config -q

      - name: Start the stack
        run: docker compose up -d --build --wait --wait-timeout 300

      - name: Show container status
        run: docker compose ps

      # Uploads a file through Nginx, checks it is served byte-for-byte, then recreates
      # the stack with down/up and proves the data is still there.
      - name: Run the smoke test
        run: bash scripts/smoke_test.sh http://localhost:8080

      - name: Dump logs on failure
        if: failure()
        run: |
          docker compose ps -a
          docker compose logs --no-color --tail 200

      - name: Tear down
        if: always()
        run: docker compose down -v
